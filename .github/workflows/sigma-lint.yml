name: Sigma rules — lint and convert

on:
  push:
    paths:
      - 'detections/sigma/**'
      - '.github/workflows/sigma-lint.yml'
  pull_request:
    paths:
      - 'detections/sigma/**'
      - '.github/workflows/sigma-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Sigma rules
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sigma tooling
        run: |
          python -m pip install --upgrade pip
          pip install pysigma pysigma-backend-splunk pysigma-pipeline-sysmon pysigma-backend-kusto pyyaml

      - name: YAML syntax check
        run: |
          python - <<'PY'
          import sys, yaml, pathlib
          rc = 0
          for p in pathlib.Path("detections/sigma").rglob("*.yml"):
              try:
                  yaml.safe_load(p.read_text())
                  print(f"[ok]  {p}")
              except yaml.YAMLError as e:
                  print(f"[err] {p}: {e}")
                  rc = 1
          sys.exit(rc)
          PY

      - name: Sigma rule structural lint
        run: |
          python - <<'PY'
          import sys, yaml, pathlib, uuid
          required = {"title", "id", "status", "description", "logsource", "detection", "level"}
          rc = 0
          for p in pathlib.Path("detections/sigma").rglob("*.yml"):
              doc = yaml.safe_load(p.read_text())
              if doc is None:
                  print(f"[err] {p}: empty document")
                  rc = 1
                  continue
              missing = required - set(doc.keys())
              if missing:
                  print(f"[err] {p}: missing keys {missing}")
                  rc = 1
              # Warn (not fail) on placeholder UUIDs while in scaffold phase
              try:
                  u = uuid.UUID(str(doc.get("id", "")))
                  if str(u).startswith("00000000-"):
                      print(f"[warn] {p}: placeholder UUID — replace before claiming production-ready")
              except ValueError:
                  print(f"[err] {p}: id is not a valid UUID")
                  rc = 1
              else:
                  print(f"[ok]  {p}")
          sys.exit(rc)
          PY

  convert:
    name: Convert Sigma -> SPL & KQL
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sigma tooling
        run: |
          pip install pysigma pysigma-backend-splunk pysigma-pipeline-sysmon pysigma-backend-kusto sigma-cli pyyaml

      # Regenerate SPL/KQL from the Sigma source and fail if the committed
      # translations are stale. This both proves every rule converts cleanly
      # (a hard gate — no more continue-on-error) and enforces that
      # detections/splunk and detections/kql are always in sync with the rules.
      - name: Verify SPL/KQL translations are in sync
        run: python scripts/generate_translations.py --check
