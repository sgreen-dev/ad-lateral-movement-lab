title: RDP Logon From Unusual Source
id: c0093769-bed3-4489-9f91-facff9b2c620
status: test
description: |
  Detects an interactive RDP logon (Windows Security Event 4624 with LogonType=10)
  from a source IP not on the maintained allow-list of jump hosts and admin
  workstations. Tuned for use after Atomic Red Team test T1021.001-1.

  Allow-list is deliberately environment-specific: in this lab there is no
  legitimate RDP jump host, so any Type 10 logon (e.g. from the Kali attacker
  at 10.0.1.10) fires. Production deployments populate filter_known_admin_sources
  with their real admin subnets/hosts.
references:
  - https://attack.mitre.org/techniques/T1021/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1021.001/T1021.001.md
author: Shurron Green
date: 2026-04-28
modified: 2026-07-29
tags:
  - attack.lateral_movement
  - attack.t1021.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 10
  filter_local_source:
    IpAddress:
      - '-'            # local console session, no network source
      - '127.0.0.1'
      - '::1'
  # To tune for a production environment, add an allow-list filter of approved
  # RDP jump hosts and OR it into the condition, e.g.:
  #   filter_known_admin_sources:
  #     IpAddress:
  #       - '10.0.50.0/24'   # admin jump subnet
  # then: condition: selection and not (filter_local_source or filter_known_admin_sources)
  condition: selection and not filter_local_source
falsepositives:
  - Legitimate administrative RDP from sources not yet on the allow-list
  - RDP gateway / brokered sessions (review WorkstationName field)
level: medium
